services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow
      POSTGRES_DB: teamflow
    volumes: [teamflow_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U teamflow"], interval: 5s, timeout: 5s, retries: 10 }
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://teamflow:teamflow@db:5432/teamflow?schema=public
      JWT_SECRET: docker-development-secret-change-in-production-123
      CLIENT_URL: http://localhost:4000
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { teamflow_data: {} }
